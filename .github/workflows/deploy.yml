# One origin, one front end - and two redirects.
#
#   /        apps/marketing   static, copied as-is
#   /ride    apps/marketing/ride   redirect to rider.traversegh.com
#   /drive   apps/marketing/drive  redirect to driver.traversegh.com
#
# This repo is named <user>.github.io on purpose: a GitHub Pages *user* site
# serves from the domain root, which is the only Pages arrangement that gives
# a bare /ride and /drive with no repo name in front of them. A project site
# would put every path under /<repo>/.
#
# The three apps used to deploy from three repos to three separate origins.
# Building them together is what makes them one site - and it also collapses
# the API's CORS allow-list from three entries to one.

name: Build and deploy the Traverse site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ------------------------------------------------------------ / ------
      # `apps/marketing/.` rather than `apps/marketing/*` so dotfiles come
      # too - .nojekyll is one, and a CNAME will be another the day a domain
      # is pointed here.
      - name: Marketing site to /
        run: |
          mkdir -p dist
          cp -R apps/marketing/. dist/
          rm -f dist/README.md

      # /ride and /drive are now redirect stubs in apps/marketing that send
      # people to rider.traversegh.com and driver.traversegh.com, where the
      # real apps live: the Expo rider and driver apps exported for the
      # browser, with every feature the phones have. They are published from
      # the traverse repo by deploy/web/publish.sh, not from here - a vite
      # rebuild of a cut-down copy is exactly what stopped being wanted.
      - name: SPA fallback for the marketing site
        run: cp apps/marketing/404.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

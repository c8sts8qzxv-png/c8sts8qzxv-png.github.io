name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        env:
          # Served from https://<user>.github.io/<repo>/, so every asset URL
          # needs that prefix or the bundle 404s.
          VITE_BASE: /traverse-driver-web/
          # Set this as a repository variable (Settings -> Secrets and
          # variables -> Actions -> Variables). Until the API is hosted it is
          # unset, the app cannot reach a backend, and it says so on screen
          # rather than failing silently.
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: npm run build
      - name: SPA fallback
        # Pages serves 404.html for any path it has no file for. Handing it
        # the app shell is what makes a deep link like /profile work on a
        # reload instead of showing GitHub's own 404.
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

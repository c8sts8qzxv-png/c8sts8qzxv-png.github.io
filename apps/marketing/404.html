<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found — Traverse</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%230E1F3D'/><path d='M26 62h48M32 62l6-22h24l6 22M38 70a5 5 0 100-10 5 5 0 000 10zM62 70a5 5 0 100-10 5 5 0 000 10z' stroke='%23C9962C' stroke-width='6' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>">

<script>
// GitHub Pages has no rewrite rules. A reload of /ride/wallet asks for a file
// that is not there, and Pages answers with this page. So before rendering
// anything, check whether the miss was actually an app deep link and hand it
// back to that app, path preserved in ?_p= for its index.html to restore.
//
// Runs before the body so a bounced deep link never paints a 404 first.
(function () {
  var m = location.pathname.match(/^\/(ride|drive)(\/.*)?$/);
  if (!m) return;                       // a genuine marketing 404; fall through.
  var app = '/' + m[1] + '/';
  var deep = m[2] && m[2] !== '/';      // /ride and /ride/ need no restoring.
  location.replace(
    deep
      ? app + '?_p=' + encodeURIComponent(location.pathname + location.search + location.hash)
      : app + location.search + location.hash
  );
})();
</script>

<style>
  :root {
    color-scheme: light dark;
    --ink: #0E1F3D; --muted: #5b6780; --gold: #8E6A1F;
    --bg: #f7f8fa; --card: #ffffff; --line: #e3e7ee;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #eef2f8; --muted: #98a3b8; --gold: #C9962C;
            --bg: #0b1220; --card: #121a2b; --line: #23304a; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: 24px; background: var(--bg); color: var(--ink);
    font: 400 16px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    width: 100%; max-width: 34rem; background: var(--card);
    border: 1px solid var(--line); border-radius: 18px; padding: 40px 32px;
  }
  .code { font: 600 13px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
          letter-spacing: .12em; text-transform: uppercase; color: var(--gold); }
  h1 { margin: 14px 0 10px; font-size: clamp(1.6rem, 4vw, 2.1rem); line-height: 1.15; }
  p { margin: 0 0 26px; color: var(--muted); }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; }
  a.btn {
    display: inline-flex; align-items: center; gap: 8px; text-decoration: none;
    padding: 11px 18px; border-radius: 11px; font-weight: 600; font-size: .95rem;
    border: 1px solid var(--line); color: var(--ink);
    transition: transform 160ms cubic-bezier(.2,.8,.3,1);
  }
  a.btn--primary { background: var(--ink); color: var(--card); border-color: var(--ink); }
  a.btn:active { transform: scale(.97); }
  @media (prefers-reduced-motion: reduce) { a.btn { transition: none; } a.btn:active { transform: none; } }
</style>
</head>
<body>
  <div class="card">
    <div class="code">404</div>
    <h1>That page isn’t here.</h1>
    <p>The link may be out of date, or the address mistyped. Everything Traverse does starts from one of these.</p>
    <div class="actions">
      <a class="btn btn--primary" href="/">Traverse home</a>
      <a class="btn" href="/ride">Ride</a>
      <a class="btn" href="/drive">Drive</a>
    </div>
  </div>
</body>
</html>

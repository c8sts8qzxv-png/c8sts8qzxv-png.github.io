<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Legal — Traverse</title>
<style>
:root {
  color-scheme: light dark;
  --ink: #14161b;
  --ink-soft: #4a5160;
  --bg: #ffffff;
  --bg-soft: #f6f7f9;
  --rule: #e3e6ea;
  --accent: #0f766e;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ink: #e8eaed; --ink-soft: #a7aebb; --bg: #14161b;
    --bg-soft: #1c1f26; --rule: #2b2f38; --accent: #5eead4;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-text-size-adjust: 100%;
}
.wrap { max-width: 44rem; margin: 0 auto; padding: 2.5rem 1.25rem 5rem; }
nav.top {
  border-bottom: 1px solid var(--rule);
  padding: 1rem 1.25rem;
  font-size: .875rem;
}
nav.top a { color: var(--ink-soft); text-decoration: none; margin-right: 1rem; }
nav.top a:hover, a:focus { color: var(--accent); text-decoration: underline; }
h1 { font-size: 1.9rem; line-height: 1.2; letter-spacing: -.02em; margin: 0 0 .35rem; }
h2 { font-size: 1.2rem; margin: 2.5rem 0 .6rem; letter-spacing: -.01em; }
h3 { font-size: 1rem; margin: 1.8rem 0 .4rem; }
p, li { color: var(--ink); }
strong { font-weight: 650; }
ul { padding-left: 1.2rem; }
li { margin: .35rem 0; }
a { color: var(--accent); }
hr { border: 0; border-top: 1px solid var(--rule); margin: 2.5rem 0; }
code {
  background: var(--bg-soft); padding: .1em .35em;
  border-radius: 4px; font-size: .9em;
}
.updated { color: var(--ink-soft); font-size: .875rem; margin: 0 0 2rem; }
footer { margin-top: 3.5rem; padding-top: 1.25rem; border-top: 1px solid var(--rule);
         color: var(--ink-soft); font-size: .8125rem; }
</style>
</head>
<body>
<nav class="top">
  <a href="/">Traverse</a>
  <a href="/ride/">Ride</a>
  <a href="/drive/">Drive</a>
</nav>
<main class="wrap">
<h1>Legal</h1>
<p class="updated">The documents that govern using Traverse.</p>
<ul>
  <li><a href="/legal/privacy-riders.html">Privacy Policy — Riders</a></li>
  <li><a href="/legal/privacy-drivers.html">Privacy Policy — Drivers</a></li>
  <li><a href="/legal/terms.html">Terms of Service</a></li>
</ul>
<p>To delete your account and the data attached to it, use
<strong>Delete my account</strong> in the app, or
<a href="/delete-account">the web form</a>.</p>
<footer>
  Traverse, Accra, Ghana.
  <a href="mailto:traversegh@gmail.com">traversegh@gmail.com</a>.
</footer>
</main>
</body>
</html>
